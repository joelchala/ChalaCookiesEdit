name: Build and Verify ChalaCookiesEdit

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mv3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Generate native PNG & SVG icons
        run: node tools/generate-icons.mjs

      - name: Run verification test suite
        run: node tests/verify.mjs

      - name: Build unpacked MV3 and ZIP packages
        run: node tools/make-mv3.mjs

      - name: Upload store packages artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chala-cookies-edit-mv3
          path: |
            store/paquetes/*.zip
            dist/build/ChalaCookiesEdit.chromium/

  publish-release:
    needs: build-mv3
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Generate icons, verify and build release packages
        run: |
          node tools/generate-icons.mjs
          node tests/verify.mjs
          node tools/make-mv3.mjs

      - name: Publish GitHub Release on version tag
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          generate_release_notes: true
          files: store/paquetes/ChalaCookiesEdit_*.zip
