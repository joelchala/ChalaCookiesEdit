name: Build and Verify ChalaCookiesEdit

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mv3:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate native PNG & SVG icons
        run: node tools/generate-icons.mjs

      - name: Run verification test suite
        run: node tests/verify.mjs

      - name: Build unpacked MV3 and ZIP packages
        run: node tools/make-mv3.mjs

      - name: Upload store packages artifact
        uses: actions/upload-artifact@v4
        with:
          name: chala-cookies-edit-mv3
          path: |
            store/paquetes/*.zip
            dist/build/ChalaCookiesEdit.chromium/

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: store/paquetes/ChalaCookiesEdit_*.zip
